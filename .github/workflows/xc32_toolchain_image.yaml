name: Build XC32 Toolchain Image

# Builds the XC32 compiler image once and pushes it to GHCR. xc32_samples.yaml
# then just pulls this image instead of installing XC32 on every run (Device
# Family Packs are fetched separately, fresh, by xc32_samples.yaml itself --
# not baked in here). Re-run manually (or on Dockerfile edits) whenever
# XC32_VERSION changes.

on:
  push:
    branches: [xc32-samples]
    paths:
      - '.github/docker/xc32-toolchain/**'
      - '.github/workflows/xc32_toolchain_image.yaml'
  workflow_dispatch:
    inputs:
      xc32_version:
        description: 'XC32 version tag for the image (e.g. v6.00)'
        required: true
        default: 'v6.00'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/zephyr-xc32-toolchain

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set version
        id: ver
        run: echo "version=${{ inputs.xc32_version || 'v6.00' }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .github/docker/xc32-toolchain
          build-args: |
            XC32_VERSION=${{ steps.ver.outputs.version }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
