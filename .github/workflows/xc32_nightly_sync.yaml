name: Weekly Upstream Sync + XC32 Build

# Keeps xc32-ci caught up with zephyrproject-rtos/zephyr's main, then builds
# the sample matrix on it. main is left untouched on purpose (it stays a
# clean mirror, safe for opening PRs upstream) — all xc32 customization
# (board yaml edits, workflows, Dockerfile) lives only on xc32-ci.
#
# NOTE: GitHub only evaluates `schedule:` triggers using the copy of this
# file on the repository's *default* branch (main), never on xc32-ci, even
# though the workflow itself only ever acts on xc32-ci. This exact file
# must also exist on main for the cron below to ever fire.
#
# The build job dispatches xc32_samples.yaml on xc32-ci via the API rather
# than `uses: ./.github/workflows/xc32_samples.yaml`: a local reusable-workflow
# reference resolves against the ref that triggered the *current* run, which
# for a schedule event is main -- and xc32_samples.yaml deliberately doesn't
# exist there, so that call failed outright before any job could even start.
# Dispatching by name/ref instead avoids needing it on main at all; the job
# then blocks on and reflects that run's real outcome so this workflow's own
# pass/fail still means something.
#
# Every other workflow in this repo was manually disabled so only the 3
# xc32 ones run. Disabling is per-workflow-path, not per-commit, so it
# survives normal upstream syncs -- but a upstream commit that introduces
# a *brand-new* workflow file would land enabled by default. The sync job
# below sweeps for and disables exactly that case every run.

on:
  schedule:
    # Weekly, Monday ~01:00 (nudged off :00 on purpose -- avoids the
    # top-of-the-hour/day scheduling spike many cron jobs land on).
    - cron: '7 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout xc32-ci
        uses: actions/checkout@v4
        with:
          ref: xc32-ci
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/main
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/zephyrproject-rtos/zephyr.git
          git fetch upstream main
          if ! git merge upstream/main --no-edit; then
            git merge --abort
            echo "::error::Merge conflict between upstream/main and xc32-ci — resolve manually, nothing was pushed."
            exit 1
          fi

      - name: Push xc32-ci
        run: git push origin xc32-ci

      - name: Disable any newly-added non-xc32 workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          keep_paths=".github/workflows/xc32_samples.yaml .github/workflows/xc32_toolchain_image.yaml .github/workflows/xc32_nightly_sync.yaml"
          gh api "repos/${{ github.repository }}/actions/workflows" --paginate --jq \
            '.workflows[] | select(.state != "disabled_manually") | "\(.id)\t\(.path)"' \
          | while IFS=$'\t' read -r id path; do
              keep=0
              for p in $keep_paths; do
                [ "$path" = "$p" ] && keep=1
              done
              if [ "$keep" -eq 0 ]; then
                echo "Disabling newly active workflow: $path (id=$id)"
                gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$id/disable"
              fi
            done

  build:
    needs: sync
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - name: Dispatch xc32_samples.yaml on xc32-ci and wait for it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          before=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run xc32_samples.yaml --repo "$REPO" --ref xc32-ci

          run_id=""
          for i in $(seq 1 30); do
            run_id=$(gh run list --repo "$REPO" --workflow=xc32_samples.yaml --branch xc32-ci \
              --json databaseId,createdAt,event \
              --jq "[.[] | select(.event == \"workflow_dispatch\" and .createdAt >= \"$before\")] | sort_by(.createdAt) | .[0].databaseId // empty")
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error::Could not find the dispatched xc32_samples.yaml run within timeout"
            exit 1
          fi

          echo "Dispatched xc32_samples.yaml run: $run_id"
          gh run watch "$run_id" --repo "$REPO" --exit-status
